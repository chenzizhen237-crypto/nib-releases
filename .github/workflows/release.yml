# Builds the Nib macOS app from the private chenzizhen237-crypto/nib source and publishes it here,
# where the in-app updater reads latest-mac.yml. It runs in this public repo because GitHub-hosted
# runners are free for public repositories; in the private one a macOS build bills ~10x per minute.
#
# Started by a v* tag in nib (its release.yml sends a repository_dispatch) or by hand from the
# Actions tab. Neither trigger can come from a fork or a pull request, so the secret stays here.
#
# Secret: NIB_SOURCE_TOKEN, a fine-grained personal access token with "Contents: read-only" on
# chenzizhen237-crypto/nib. Publishing uses this repo's own GITHUB_TOKEN.
#
# This repo is public, so the run logs are too: they show build and test output, not source.
name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag in chenzizhen237-crypto/nib to build, e.g. v0.1.3 (any branch or tag for a dry run)
        required: true
      dry_run:
        description: Build, test and package without publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create and publish the release in this repo

jobs:
  mac:
    runs-on: macos-latest # Apple silicon: the arm64 build
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check the tag
        if: env.DRY_RUN != 'true'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version tag: '$TAG'"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: chenzizhen237-crypto/nib
          ref: ${{ env.DRY_RUN == 'true' && env.TAG || format('refs/tags/{0}', env.TAG) }}
          token: ${{ secrets.NIB_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Tag matches package.json version
        if: env.DRY_RUN != 'true'
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG but package.json says $v"; exit 1; }
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Package (dry run, nothing published)
        if: env.DRY_RUN == 'true'
        run: pnpm dist && ls -l release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build and publish
        if: env.DRY_RUN != 'true'
        run: pnpm release # scripts/release.sh: draft, upload, verify, publish
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned, like local builds (mac.identity is null)
