# Builds the Nib desktop app for macOS, Windows and Linux from the private chenzizhen237-crypto/nib
# source and publishes it here, where the in-app updater reads latest-mac.yml, latest.yml and
# latest-linux.yml. It runs in this public repo because GitHub-hosted runners are free for public
# repositories; in the private one a macOS build bills ~10x per minute and Windows ~2x.
#
# Started by a v* tag in nib (its release.yml sends a repository_dispatch) or by hand from the
# Actions tab. Neither trigger can come from a fork or a pull request, so the secret stays here.
# A dry run builds and packages any branch or tag and keeps the installers as run
# artifacts for a few days, without touching releases.
#
# Secret: NIB_SOURCE_TOKEN, a fine-grained personal access token with "Contents: read-only" on
# chenzizhen237-crypto/nib. Publishing uses this repo's own GITHUB_TOKEN.
#
# This repo is public, so the run logs are too: they show build and test output, not source.
name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag in chenzizhen237-crypto/nib to build, e.g. v0.1.3 (any branch or tag for a dry run)
        required: true
      dry_run:
        description: Build, test and package without publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create and publish the release in this repo

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  SOURCE_REF: ${{ (inputs.dry_run && (github.event.client_payload.tag || inputs.tag)) || format('refs/tags/{0}', github.event.client_payload.tag || inputs.tag) }}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the tag
        if: env.DRY_RUN != 'true'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version tag: '$TAG'"; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: chenzizhen237-crypto/nib
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NIB_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Tag matches package.json version
        if: env.DRY_RUN != 'true'
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG but package.json says $v"; exit 1; }
      - name: Create the draft release
        if: env.DRY_RUN != 'true'
        run: bash scripts/release.sh draft
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    strategy:
      fail-fast: true # one broken platform stops the release; the draft stays unpublished
      matrix:
        include:
          - { os: macos-latest, platform: mac } # Apple silicon: the arm64 build
          - { os: windows-latest, platform: win }
          - { os: ubuntu-latest, platform: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          repository: chenzizhen237-crypto/nib
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NIB_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache: a poisoned cache entry would end up inside published installers.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # No tests: the tag is on main, which already passed CI in nib.
      - run: pnpm build
      - name: Package (dry run, nothing published)
        if: env.DRY_RUN == 'true'
        run: pnpm dist && ls -l release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the dry-run installers
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nib-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          retention-days: 3
          if-no-files-found: error
      - name: Build and upload into the draft
        if: env.DRY_RUN != 'true'
        run: bash scripts/release.sh build
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned, like local builds (mac.identity is null)

  publish:
    needs: build
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: chenzizhen237-crypto/nib
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NIB_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Check every platform's files and publish
        run: bash scripts/release.sh publish
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: mac win linux
